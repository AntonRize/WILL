<!-- LOGOS MAP · reveal on scroll + active section in the rail -->
<script>
(function () {
  function init() {
    /* ---- 1. reveal blocks as they enter the viewport ---- */
    var blocks = document.querySelectorAll('.lm-reveal');

    if (!('IntersectionObserver' in window)) {
      blocks.forEach(function (el) { el.classList.add('is-visible'); });
      return;
    }

    var revealObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var el = entry.target;
        var delay = parseInt(el.getAttribute('data-lm-delay') || '0', 10);
        window.setTimeout(function () { el.classList.add('is-visible'); }, delay);
        revealObserver.unobserve(el);
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });

    /* stagger siblings inside each act so a section arrives as a sequence */
    document.querySelectorAll('.lm-act, .lm-hero').forEach(function (section) {
      var items = section.querySelectorAll('.lm-reveal');
      items.forEach(function (item, i) {
        item.setAttribute('data-lm-delay', String(Math.min(i, 4) * 90));
      });
    });

    blocks.forEach(function (el) { revealObserver.observe(el); });

    /* ---- 2. highlight the current act in the sticky rail ---- */
    var dots = Array.prototype.slice.call(document.querySelectorAll('.lm-rail__dot'));
    if (!dots.length) return;

    var acts = dots.map(function (dot) {
      var id = dot.getAttribute('href').slice(1);
      return document.getElementById(id);
    });

    var railObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var idx = acts.indexOf(entry.target);
        if (idx < 0) return;
        if (entry.isIntersecting) {
          dots.forEach(function (d) { d.classList.remove('is-active'); });
          dots[idx].classList.add('is-active');
        }
      });
    }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });

    acts.forEach(function (act) { if (act) railObserver.observe(act); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
