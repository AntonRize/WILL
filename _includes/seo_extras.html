<!-- ============================================================
     seo_extras.html
     Head partial included by EVERY layout. Covers what
     jekyll-seo-tag does not: favicons, social images, and the
     full JSON-LD graph.
     ============================================================ -->

<!-- ---------- Favicons ----------
     /favicon.ico is a real multi-size icon at the site root, which is
     where Google's favicon crawler and older browsers look for it. -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/favicon/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<meta name="theme-color" content="#0f172a">

<!-- ---------- Social preview image ----------
     jekyll-seo-tag only reads page.image, never site.image, so without
     this block no page on the site emits an og:image at all. Page front
     matter can still override it with its own `image:` value. -->
{% assign og_image = page.image | default: site.image | default: '/images/WILL_OG.png' %}
{% assign og_image_abs = og_image | absolute_url %}
<!-- og:image, twitter:card and twitter:image are emitted by jekyll-seo-tag
     itself, using the page-level `image` default set in _config.yml. Writing
     them again here produced two twitter:card tags, and the plugin's copy came
     first, so social networks saw the small card. Only the extras the plugin
     does not provide are set below. -->
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ page.title | default: site.title | escape }} | {{ site.title }}">
<meta name="twitter:creator" content="@{{ site.twitter.username }}">

<!-- ---------- Crawler directives ----------
     Set `noindex: true` in a page's front matter to keep it out of search
     results while leaving it reachable by direct link. -->
{% if page.noindex %}
<meta name="robots" content="noindex, follow">
{% else %}
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
{% endif %}
