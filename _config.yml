# Site settings
title: "WILL Relational Geometry"
description: "Open research in foundations of physics by Anton Rize. Derives Special and General Relativity, Cosmology, and Quantum Mechanics from a single geometric principle. An alternative to dark matter and dark energy with zero free parameters."
author: "Anton Rize"
email: "antonrize@willrg.com"
baseurl: ""
url: "https://willrg.com"
lang: "en"

# Social / SEO
twitter:
  card: summary_large_image
  username: anton_rize
social:
  name: Anton Rize
  links:
    - https://x.com/anton_rize
    - https://github.com/AntonRize/WILL
    - https://www.youtube.com/@anton_rize
    - https://www.facebook.com/anton.rize
    - https://www.researchgate.net/profile/Anton-Rize
github_username: AntonRize
logo: /images/WILL_LOGO.png
image: /images/WILL_OG.png

# Jekyll settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from 


# MathJax settings
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Navigation
#
# Pages deliberately left OUT of the header. They stay published, stay in the
# sitemap and stay reachable by anyone with the link. They are simply not
# advertised from the site itself:
#
#   /discussions/        work in progress
#   /assistant/chats/    exists for search engines and direct links, not
#                        as a public browsing section
#
navigation:
  - title: "Logos Map"
    url: /logos_map/
  - title: "Documents & Results"
    url: /results/
  - title: "Predictions"
    url: /predictions/
  - title: "RG vs GR"
    url: /RGvsGR/
  - title: "WILL AI"
    url: /will-ai/
  - title: "Holographic Decoder"
    url: /decoder/
  - title: "Galactic Dynamics"
    url: /galactic_dynamics/
  - title: "About"
    url: /about/
  - title: "Help This Research"
    url: /help/

# Exclusions — not built, not served, not indexable
exclude:
  - Gemfile
  - Gemfile.lock
  - FR/
  - Holster/
  - proxy-server/
  - SPARC DATA/
  - node_modules/
  - package.json
  - package-lock.json
  - Claude_skills/
  - Pantheon_data/
  - tailwind.config.js
  - assets/css/src/
  # Repo-internal files. Each one was read before being listed here.
  #
  # README.md: 4,522 words, and 98.6% identical to WILL_RG_MAP.md, which is
  # already published as the /research_map/ page. Excluding it here only
  # affects the website build — GitHub still shows the README on the repo
  # front page exactly as before. This just stops the same text being served
  # twice, which search engines treat as duplicate content.
  - README.md
  # Plain-text dumps of the notebook catalogue. The readable version is
  # already published at /addon/NOTEBOOK_CATALOG/.
  - CATALOG_SUMMARY.txt
  - NOTEBOOK_CATALOG.txt
  - NOTEBOOK_CATALOG_INDEX.json
  # Video upload instructions. Working notes, not research.
  - WILL DATABASE/video2a/
  # React source saved with an .html extension. It was being served as a page
  # and rendered as unformatted source code. It must be excluded here rather
  # than given front matter: front matter makes Jekyll render the file as a
  # template, and React's style={{ ... }} is indistinguishable from Liquid's
  # own {{ ... }} syntax, which breaks the build.
  - horizon.html
  # April brainstorming notes on outreach and YouTube plans. Kept in the repo,
  # not served on the website.
  - documents/WILL_RG_Strategy_Plan.md
  - documents/WILL_RG_Strategy_Plan.md.pdf
  - fix_notebook_metadata.py
  - fix_log_seo.py
  - curate_log_titles.py
  - promote_chat.py
  - SEO_AUDIT.md
  - SEO_KEYWORDS.md
  - SEO_BASELINE_2026-08-02.md
  - ANALYTICS_EVENTS.md

# Per-path defaults
defaults:
  # ---------------------------------------------------------------------
  # RAW WILL-AI LOGS — invisible to search, by default, permanently.
  #
  # These pages are generated by whatever any visitor happens to type into
  # WILL-AI. The content is not reviewed before it goes live, so the folder
  # is treated as untrusted: never indexed, never in the sitemap.
  #
  # Quality conversations get promoted by hand into assistant/chats/,
  # which IS indexed. See promote_chat.py.
  # ---------------------------------------------------------------------
  - scope:
      path: "assistant/logs"
    values:
      noindex: true
      sitemap: false

  - scope:
      path: "assistant/logs.html"
    values:
      noindex: true
      sitemap: false

  # ---------------------------------------------------------------------
  # CURATED CHATS — hand-picked, edited, and meant to rank.
  # ---------------------------------------------------------------------
  - scope:
      path: "assistant/chats"
    values:
      layout: log
      curated: true
      noindex: false
      sitemap: true

# Collections for content organization
collections:
  parts:
    output: true
    permalink: /:collection/:name/
  results:
    output: true
    permalink: /:collection/:name/
  discussions:
    output: true
    permalink: /:collection/:name/
  logs:
    output: true
    permalink: /assistant/logs/:name/
